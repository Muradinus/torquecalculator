<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Момент затяжки — калькулятор</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#111315; --panel:#1a1d20; --line:#34393e; --muted:#929ba2; --text:#f4f1e9; --accent:#d9ff55; --danger:#ff7d65; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--text); background:radial-gradient(circle at 78% 4%,#2b3320 0,transparent 25%),var(--bg); font-family:'Space Grotesk',sans-serif; }
    .wrap { width:min(100% - 40px, 960px); margin:0 auto; padding:42px 0 48px; }
    header { display:flex; justify-content:space-between; align-items:flex-start; gap:24px; margin-bottom:56px; }
    .eyebrow { color:var(--accent); font:500 12px 'DM Mono',monospace; letter-spacing:.14em; text-transform:uppercase; }
    h1 { font-size:clamp(38px,7vw,76px); line-height:.92; letter-spacing:-.065em; max-width:580px; margin:16px 0 0; }
    .gravity { font:500 13px 'DM Mono',monospace; color:var(--muted); padding-top:4px; white-space:nowrap; }
    .gravity span { color:var(--accent); }
    main { display:grid; grid-template-columns:1fr .82fr; gap:18px; align-items:stretch; }
    .card { background:rgba(26,29,32,.88); border:1px solid var(--line); border-radius:18px; padding:27px; box-shadow:0 18px 60px rgba(0,0,0,.18); }
    .card h2 { font-size:18px; margin:0 0 25px; letter-spacing:-.02em; }
    .field { margin-bottom:25px; }
    label { display:block; color:var(--muted); font-size:13px; margin-bottom:10px; }
    .input-row { display:flex; align-items:center; border-bottom:1px solid #596067; transition:border-color .2s; }
    .input-row:focus-within { border-color:var(--accent); }
    input { width:100%; border:0; outline:0; color:var(--text); background:transparent; font:500 30px 'DM Mono',monospace; padding:4px 0 11px; }
    .unit { color:var(--muted); font:500 14px 'DM Mono',monospace; padding-bottom:10px; }
    .modes { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:25px; }
    button { border:1px solid var(--line); border-radius:10px; background:#22272b; color:var(--muted); font:500 13px 'Space Grotesk',sans-serif; padding:13px 10px; cursor:pointer; transition:.2s; }
    button:hover { border-color:#707a82; color:var(--text); }
    button.active { background:var(--accent); border-color:var(--accent); color:#111315; }
    .calc { width:100%; background:var(--accent); color:#111315; border-color:var(--accent); font-weight:700; margin-top:2px; padding:15px; }
    .result { display:flex; flex-direction:column; justify-content:space-between; min-height:100%; }
    .result .tag { color:var(--muted); font:500 12px 'DM Mono',monospace; letter-spacing:.12em; text-transform:uppercase; }
    .value { margin:32px 0 8px; color:var(--accent); font:500 clamp(48px,8vw,84px)/.95 'DM Mono',monospace; letter-spacing:-.08em; word-break:break-word; }
    .result-unit { font-size:18px; color:var(--text); }
    .hint { border-top:1px solid var(--line); padding-top:18px; color:var(--muted); font-size:14px; line-height:1.5; }
    .error { min-height:21px; color:var(--danger); font-size:13px; margin-top:10px; }
    footer { margin-top:36px; display:flex; justify-content:space-between; color:#6f777d; font:12px 'DM Mono',monospace; }
    @media (max-width:700px) { .wrap{width:min(100% - 28px,960px);padding-top:28px} header{margin-bottom:36px;display:block}.gravity{margin-top:18px} main{grid-template-columns:1fr}.result{min-height:300px}.value{margin-top:44px} footer{gap:12px;flex-direction:column} }
  </style>
</head>
<body>
  <div class="wrap">
    <header><div><div class="eyebrow">Workshop / 01</div><h1>Момент<br>затяжки</h1></div><div class="gravity">GRAVITY = <span>9.81</span> м/с²</div></header>
    <main>
      <section class="card">
        <h2>Параметры расчёта</h2>
        <div class="field"><label for="length">Длина ключа</label><div class="input-row"><input id="length" type="number" min="0.01" step="any" value="30" inputmode="decimal"><span class="unit">см</span></div></div>
        <div class="field"><label>Что нужно узнать?</label><div class="modes"><button class="mode active" data-mode="torque">Момент<br>по силе</button><button class="mode" data-mode="force">Силу<br>по моменту</button></div></div>
        <div class="field"><label id="measure-label" for="measure">Приложенная сила</label><div class="input-row"><input id="measure" type="number" min="0" step="any" value="10" inputmode="decimal"><span class="unit" id="measure-unit">кг</span></div><div class="error" id="error"></div></div>
        <button class="calc" id="calculate">Рассчитать&nbsp; →</button>
      </section>
      <section class="card result"><div><div class="tag">Результат расчёта</div><div class="value" id="value">29.43</div><div class="result-unit" id="result-unit">Н·м</div></div><div class="hint" id="hint">При ключе длиной 30 см и силе 10 кг момент составит 29.43 Н·м.</div></section>
    </main>
    <footer><span>TORQUE CALCULATOR</span><span>SI / METRIC</span></footer>
  </div>
  <script>
    const G=9.81; let mode='torque'; const $=id=>document.getElementById(id);
    function calculate(){ const length=Number($('length').value), measure=Number($('measure').value), error=$('error'); error.textContent=''; if(!length||length<=0){error.textContent='Длина ключа должна быть больше 0.';return} if(measure<0||!Number.isFinite(measure)){error.textContent='Введите корректное значение.';return} const m=length/100; if(mode==='torque'){const result=measure*G*m;$('value').textContent=result.toFixed(2);$('result-unit').textContent='Н·м';$('hint').textContent=`При ключе длиной ${length} см и силе ${measure} кг момент составит ${result.toFixed(2)} Н·м.`} else {const result=measure/(G*m);$('value').textContent=result.toFixed(2);$('result-unit').textContent='кг силы';$('hint').textContent=`Чтобы получить ${measure} Н·м на ключе длиной ${length} см, нужно приложить ${result.toFixed(2)} кг.`} }
    document.querySelectorAll('.mode').forEach(btn=>btn.addEventListener('click',()=>{mode=btn.dataset.mode;document.querySelectorAll('.mode').forEach(b=>b.classList.remove('active'));btn.classList.add('active');if(mode==='torque'){$('measure-label').textContent='Приложенная сила';$('measure-unit').textContent='кг';$('measure').value=10}else{$('measure-label').textContent='Нужный момент';$('measure-unit').textContent='Н·м';$('measure').value=30}calculate()})); $('calculate').addEventListener('click',calculate); document.querySelectorAll('input').forEach(i=>i.addEventListener('input',calculate)); calculate();
  </script>
</body></html>
